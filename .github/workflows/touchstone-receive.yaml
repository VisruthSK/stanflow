name: Continuous Benchmarks (Receive)

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      # Run benchmarks when files related to cite or funscanr are changed
      - "R/aaa.R"
      - "R/citation.R"
      - "R/funscanr.R"
      - "data-raw/sysdata.R"
      - "data-raw/**citations.R"
      # Benchmarking config and scripts
      - "touchstone/**"
      # Workflow configuration
      - ".github/workflows/touchstone-*.yaml"
      # Package metadata
      - "DESCRIPTION"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      config: ${{ steps.read_touchstone_config.outputs.config }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: read_touchstone_config
        run: |
          content=`cat ./touchstone/config.json`
          # the following lines are only required for multi line json
          content="${content//'%'/'%25'}"
          content="${content//$'\n'/'%0A'}"
          content="${content//$'\r'/'%0D'}"
          # end of optional handling for multi line json
          echo "config=$content" >> $GITHUB_OUTPUT


  build:
    needs: prepare
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - ${{ fromJson(needs.prepare.outputs.config) }}
    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      RSPM: ${{ matrix.config.rspm }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Touchstone receives config from touchstone/config.json including:
      # - benchmarking_repo: Repository to benchmark against
      # - benchmarking_ref: Git ref/tag of the repository
      # - benchmarking_path: Local path where repo will be cloned
      # - r-version: R version to use for benchmarking
      - uses: lorenzwalthert/touchstone/actions/receive@main
        with:
          cache-version: 1
          benchmarking_repo: ${{ matrix.config.benchmarking_repo }}
          benchmarking_ref: ${{ matrix.config.benchmarking_ref }}
          benchmarking_path: ${{ matrix.config.benchmarking_path }}
          r-version: ${{ matrix.config.r }}
